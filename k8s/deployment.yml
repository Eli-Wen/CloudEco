apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudeco-api
  namespace: cloudeco
  labels:
    app.kubernetes.io/name: cloudeco-api
    app.kubernetes.io/part-of: fit5225-a1
    app.kubernetes.io/component: inference-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudeco-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudeco-api
        app.kubernetes.io/part-of: fit5225-a1
        app.kubernetes.io/component: inference-api
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: cloudeco-api
          image: cloudecoa1sjkfk2lm.azurecr.io/cloudeco-a1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
